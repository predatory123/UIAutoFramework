[pytest]
# Pytest configuration for UI automation

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    web: Web UI tests (Selenium)
    app: Mobile App tests (Appium)
    smoke: Smoke tests
    regression: Regression tests

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    --alluredir=reports/allure-results
    --clean-alluredir

# Timeout
timeout = 300
timeout_method = thread

# Logging
log_cli = false
log_cli_level = INFO

# Parallel execution
# Use: pytest -n auto (requires pytest-xdist)